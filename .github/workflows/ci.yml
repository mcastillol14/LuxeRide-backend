name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        run: ./mvnw -B compile

      # los tests son unitarios con mocks, no necesitan mysql levantado
      - name: Tests
        run: ./mvnw -B test

      - name: Build del jar
        run: ./mvnw -B package -DskipTests

      - name: Build de la imagen docker
        run: docker build -t luxeride-backend:ci .
